# Moteur Toolkit d'ArmorPaint (lot C3) : voir engine.py.
configuration:
    debug_logging:
        type: bool
        description: Messages de debug de Toolkit dans le log d'ArmorPaint.
        default_value: false
    menu_favourites:
        type: list
        description: Commandes mises en tête du menu ShotGrid d'ArmorPaint, comme dans les autres moteurs.
        values:
            type: dict
            items:
                app_instance: { type: str }
                name: { type: str }
        allows_empty: True
        default_value: []

display_name: "ArmorPaint"
description: "ArmorPaint integration: Toolkit apps run in the ArmorPaint ShotGrid sidecar and drive the scene through it."

requires_shotgun_version:
requires_core_version: "v0.19.18"

frameworks:
