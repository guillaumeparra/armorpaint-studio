# pip install of subzero: pip install "subzero-@VERSION@-py3-none-any.whl[all]", or from the unpacked release folder
# pip install ".[all]". Extras: window (PySide6), color (opencolorio, numpy), all. Without extras: the command line
# (subzero render / info / locate) only, for render machines, or a Python that already has PySide6 (a DCC).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subzero"
version = "@VERSION@"
description = "subzero: .sbs/.sbsar materials rendered by sbsrender, exported to a folder (window and command line)"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
window = ["PySide6>=6.5"]
color = ["opencolorio>=2.2", "numpy>=1.20"]
all = ["PySide6>=6.5", "opencolorio>=2.2", "numpy>=1.20"]

[project.scripts]
subzero = "subzero:main"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["subzero"]
