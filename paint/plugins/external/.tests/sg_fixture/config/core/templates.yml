# Templates d'une config studio minimale, aux noms par défaut du sidecar (studio_sg_session.py).
keys:
    Asset:
        type: str
    sg_asset_type:
        type: str
    Step:
        type: str
    Sequence:
        type: str
    Shot:
        type: str
    name:
        type: str
        filter_by: alphanumeric
    version:
        type: int
        format_spec: "03"
    # Textures exportées (lot B3, op texture_pattern) : canal du preset d'export, tuile UDIM, extension. Canal sans
    # filter_by: alphanumeric (comme mari.channel de tk-config-default2) : les presets ont base_color, sheen_tint…
    channel:
        type: str
    UDIM:
        type: sequence
        format_spec: "04"
        # Comme tk-config-default2 : le chemin d'un publish UDIM porte <UDIM> (la valeur par défaut d'une clé
        # sequence, %04d sans ce réglage, remplace la tuile dans le chemin enregistré par ShotGrid).
        default: "<UDIM>"
    texture_ext:
        type: str
        choices: [png, jpg, exr]

paths:
    asset_root: assets/{sg_asset_type}/{Asset}/{Step}
    shot_root: sequences/{Sequence}/{Shot}/{Step}
    armorpaint_asset_work_area: '@asset_root/work/armorpaint'
    armorpaint_asset_work: '@asset_root/work/armorpaint/{name}.v{version}.arm'
    armorpaint_asset_publish_area: '@asset_root/publish/armorpaint'
    armorpaint_asset_publish: '@asset_root/publish/armorpaint/{name}.v{version}.arm'
    armorpaint_shot_work_area: '@shot_root/work/armorpaint'
    armorpaint_shot_work: '@shot_root/work/armorpaint/{name}.v{version}.arm'
    armorpaint_shot_publish_area: '@shot_root/publish/armorpaint'
    armorpaint_shot_publish: '@shot_root/publish/armorpaint/{name}.v{version}.arm'
    armorpaint_asset_textures: '@asset_root/work/armorpaint/textures/v{version}/{name}_{channel}[.{UDIM}].{texture_ext}'
    armorpaint_shot_textures: '@shot_root/work/armorpaint/textures/v{version}/{name}_{channel}.{texture_ext}'
    # Textures publiées (lot C4) : copiées du dossier de travail par le plugin Publish Textures.
    armorpaint_asset_textures_publish: '@asset_root/publish/armorpaint/textures/v{version}/{name}_{channel}[.{UDIM}].{texture_ext}'
    armorpaint_shot_textures_publish: '@shot_root/publish/armorpaint/textures/v{version}/{name}_{channel}.{texture_ext}'

strings: {}
